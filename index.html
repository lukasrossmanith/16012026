<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#170d16" />
    <title>A little game for you</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <section class="screen login-screen is-active" id="login-screen" aria-labelledby="login-title">
        <div class="glow glow-one"></div><div class="glow glow-two"></div>
        <div class="login-card">
          <form id="login-form" novalidate>
            <label class="sr-only" for="password">Password</label>
            <input id="password" name="password" type="password" inputmode="numeric" autocomplete="off" placeholder="Password" autofocus />
            <p id="login-error" class="form-error" aria-live="polite"></p>
            <button type="submit" aria-label="Unlock">→</button>
          </form>
        </div>
      </section>
      <section class="screen game-screen" id="game-screen" aria-label="Tic-tac-toe" hidden>
        <div class="game-content">
          <p class="game-status" id="game-status" aria-live="polite">Your turn — make a line of three hearts.</p>
        <div class="board" id="board" aria-label="Tic-tac-toe board" role="grid">
          <button class="cell" type="button" role="gridcell" aria-label="Top left"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Top middle"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Top right"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Middle left"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Middle"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Middle right"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Bottom left"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Bottom middle"></button>
          <button class="cell" type="button" role="gridcell" aria-label="Bottom right"></button>
        </div>
        </div>
      </section>
      <section class="screen loss-screen" id="loss-screen" aria-labelledby="loss-title" hidden>
        <div class="loss-card">
          <p id="loss-title">Pech im Spiel, Glück in der Liebe! ♡</p>
          <button id="play-again" type="button">Play again</button>
        </div>
      </section>
      <section class="screen gallery-screen" id="gallery-screen" aria-labelledby="gallery-title" hidden>
        <header class="gallery-header"><h2 id="gallery-title">lieb dich :)</h2></header>
        <div class="carousel-stage" aria-label="Photo carousel"><div class="carousel" id="carousel"></div></div>
        <div class="gallery-controls" aria-label="Carousel controls">
          <button id="previous" type="button" aria-label="Previous photo" disabled>←</button>
          <button id="next" type="button" aria-label="Next photo" disabled>→</button>
        </div>
        <div class="pagination" id="pagination" aria-label="Photo pagination"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
